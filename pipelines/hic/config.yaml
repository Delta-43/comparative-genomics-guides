# In situ Hi-C pipeline configuration (guides/04-hic.md).
samples: "samples.tsv"          # columns: sample, fastq_1, fastq_2, genome
outdir: "results"
enzyme: "MboI"                  # one of Juicer's built-in enzymes: HindIII, DpnII, MboI, Sau3AI, Arima
genomes:
  hg38:
    fasta: "resources/hg38.fa"   # UCSC naming (chr1, ...)
    chroms: [chr1, chr2, chr3, chr4, chr5, chr6, chr7, chr8, chr9, chr10, chr11, chr12, chr13, chr14,
             chr15, chr16, chr17, chr18, chr19, chr20, chr21, chr22, chrX]
# mm39:
#   fasta: "resources/mm39.fa"
#   chroms: [chr1, chr2, chr3, chr4, chr5, chr6, chr7, chr8, chr9, chr10, chr11, chr12, chr13, chr14,
#            chr15, chr16, chr17, chr18, chr19, chrX]
trim_galore_args: "--paired"
loop_caller: "hiccups"          # hiccups | mustache | none
hiccups_resolutions: "5000,10000,25000"
mustache_resolution: 5000
topdom_window: 4
juicer_commit: "177eb610397e4207fc56db1df169b2d08d06d43a"   # aidenlab/juicer, pinned for reproducibility
juicer_tools_url: "https://github.com/aidenlab/Juicebox/releases/download/v2.20.00/juicer_tools.2.20.00.jar"
threads: {default: 4, juicer: 16, trim_galore: 4}
mem_mb: {dump: 8000}
