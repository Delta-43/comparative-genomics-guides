# ---------------------------------------------------------------------------------------------
# Example profile: the ATAC-seq and histone ChIP-seq data of Ciuba et al. 2025, Cell Stem Cell
# 32:426-444 (doi:10.1016/j.stem.2024.12.011). ArrayExpress: E-MTAB-13253 (ATAC-seq),
# E-MTAB-13254 (H3K27ac ChIP-seq), E-MTAB-13255 (H3K4me3 ChIP-seq).
#
# A worked example of a cross-species set-up, not a recommended default. Settings follow the
# study's public ArrayExpress protocols: 100 bp paired-end reads, bowtie2 with default options
# against an hg38-backbone consensus genome masked against chimpanzee (panTro6) and macaque
# (rheMac10), and RPGC-normalised bigWigs. No ChIP input controls were deposited, so peaks are
# called without a control.
#
# This is a COMPLETE config. Copy it over config.yaml rather than passing it with --configfile:
# Snakemake merges nested keys, so the default GRCh38 genome would stay in `genomes`.
#   cp examples/ciuba2025.yaml config.yaml && snakemake --use-conda --cores 16 -n
#
# One dataset per run. Set `assay` and `samples` below, and give each run its own `outdir`:
#   ATAC-seq: assay "atac", sheet from E-MTAB-13253_ATAC-seq.ena.tsv
#   H3K27ac:  assay "chip", sheet from E-MTAB-13254_H3K27ac.ena.tsv
#   H3K4me3:  assay "chip", sheet from E-MTAB-13255_H3K4me3.ena.tsv
# Sheets: python ../demo_data/make_samples.py ../demo_data/<table>.ena.tsv --pipeline chip_atac \
#           --outdir ciuba2025_data/<assay>     (then run the download.sh it writes)
# Build the consensus genome first with pipelines/consensus_genome (its default config is this study's).
# ---------------------------------------------------------------------------------------------
assay: "atac"
samples: "ciuba2025_data/atac/samples.tsv"
outdir: "results_ciuba2025_atac"

min_mapq: 30
remove_duplicates: true
atac_shift: true
use_controls: false             # no input/IgG libraries in the public deposit
min_fragment_length: 0

genomes:
  hg38_consensus:
    fasta: "../consensus_genome/results/hg38_panTro6_rheMac10.consensus.ucsc.fa"
    gtf: "resources/gencode.v46.annotation.gtf"     # hg38 annotation applies unchanged (same coordinates)
    blacklist: "resources/hg38-blacklist.v2.bed"    # hg38 blacklist applies unchanged (same coordinates)
    # The masked consensus has fewer mappable bases than hg38, so count its non-N bases instead of
    # using the deepTools table value (GRCh38, 100 bp reads: 2820945813).
    effective_genome_size: "auto"

drop_chrom_regex: "^(chrM|MT|M|chrUn.*|Un.*|.*_random|.*_alt|.*_fix|KI[0-9].*|GL[0-9].*|JH[0-9].*|NW_.*)$"

trim_galore_args: ""
bowtie2_args:     ""            # bowtie2 default options, as in the public protocol. Note the
                                # default -X 500 drops fragments > 500 bp (multi-nucleosome ATAC).
macs2_args:       "-f BAMPE --keep-dup all"
bigwig_binsize: 10
ignore_for_normalization: "chrX chrY X Y"

bbsplit_ambiguous: "toss"       # unused with one genome
bbsplit_xmx: "96g"

threads: {default: 4, bowtie2: 8, trim_galore: 4, filter: 4, bbsplit: 16, bamcoverage: 4}
